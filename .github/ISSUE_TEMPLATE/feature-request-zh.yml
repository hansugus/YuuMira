name: 功能建议（中文）
description: 建议新增能力或改进现有 YuuMira 工作流
title: "[Feature][中文] "
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议。请从需要解决的问题出发描述，而不只是功能名称。提交前请搜索现有 Issues，并避免包含私密或敏感内容。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你在什么场景遇到了什么困难？目前为什么难以完成？
      placeholder: 当我……时，我需要……，因为……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述你期望的交互、行为或结果。
    validations:
      required: true

  - type: textarea
    id: use-cases
    attributes:
      label: 使用场景与受益对象
      description: 谁会使用它？请给出一两个具体场景。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案
      description: 你目前如何绕过这个问题？现有方案有什么不足？

  - type: input
    id: version
    attributes:
      label: 相关 YuuMira 版本（可选）
      placeholder: 例如 0.11.12

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可附已脱敏的示意图、参考产品或其他背景。

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issues，没有找到相同建议。
          required: true
        - label: 我已移除 API Key、Token、个人信息和其他敏感内容。
          required: true
