name: 错误报告（中文）
description: 报告可复现的功能异常、崩溃或安装与更新问题
title: "[Bug][中文] "
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进 YuuMira。请完整填写以下信息。

        **安全漏洞请勿在此公开提交。** 请阅读 [安全策略](https://github.com/hansugus/yuuone/blob/main/SECURITY_CN.md)并发送邮件至 `support@yuuone.app`。提交日志或截图前，请移除 API Key、Token、Cookie、个人信息和工作区敏感内容。

  - type: input
    id: version
    attributes:
      label: YuuMira 版本
      description: 可在应用的“关于”或设置页面查看，请填写完整版本号。
      placeholder: 例如 0.11.12
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: 操作系统
      options:
        - macOS（Apple 芯片）
        - macOS（Intel）
        - Windows 64 位
        - 其他
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: 操作系统版本
      placeholder: 例如 macOS 26.0 或 Windows 11 24H2
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 受影响的功能
      options:
        - 安装、启动或更新
        - 会话或模型连接
        - 工作区、文件或终端
        - Sources、MCP 或 API
        - 技能、自动化或任务
        - 电脑操作或浏览器
        - 界面、性能或其他
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 简洁说明发生了什么，以及问题是否稳定复现。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供最小且可重复的操作步骤。
      placeholder: |
        1. 打开……
        2. 选择……
        3. 执行……
        4. 出现……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      description: 正常情况下应该发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 实际发生了什么？请包含完整错误信息。
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: 日志、截图或补充信息
      description: 可粘贴已脱敏日志，或拖入截图和录屏。请不要上传凭据和敏感数据。
      render: shell

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已查阅文档并搜索现有 Issues，没有找到相同问题。
          required: true
        - label: 我已移除 API Key、Token、Cookie、个人信息和其他敏感内容。
          required: true
        - label: 这不是需要私密报告的安全漏洞。
          required: true
